name: macOS DMG

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos-dmg.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig.json'
      - 'vite.config.ts'

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Ad-hoc signature. No Apple Developer ID credentials are needed.
      APPLE_SIGNING_IDENTITY: '-'
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the universal installer
        run: npm run tauri -- build --ci --target universal-apple-darwin --bundles dmg -- --locked

      - name: Verify the installer
        shell: bash
        run: |
          images=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          [[ ${#images[@]} -eq 1 && -f "${images[0]}" ]]
          hdiutil verify "${images[0]}"
          mountpoint=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "${images[0]}"
          trap 'hdiutil detach "$mountpoint"; rmdir "$mountpoint"' EXIT
          apps=("$mountpoint"/*.app)
          [[ ${#apps[@]} -eq 1 && -d "${apps[0]}" ]]
          lipo -verify_arch arm64 x86_64 "${apps[0]}/Contents/MacOS/profitherm-crm"
          codesign --verify --deep --strict "${apps[0]}"
          if [[ -n "$(find "$mountpoint" -type f \( -iname '*.db' -o -iname '*.db-*' -o -iname '*.sqlite*' \) -print -quit)" ]]; then
            echo "::error::The installer contains a SQLite database or sidecar file."
            exit 1
          fi

      - name: Upload the DMG
        uses: actions/upload-artifact@v7
        with:
          name: PROFITHERM-CRM-macOS-universal
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
